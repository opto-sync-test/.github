name: Polyglot SDK consumer matrix

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * 2,5'
  workflow_dispatch:
  repository_dispatch:
    types: [clients-updated]

permissions:
  contents: read

jobs:
  sdk-clients:
    uses: zed-pkg-test/.github/.github/workflows/sdk-client-language-matrix.yml@fbdd53e658e9f370a5d155d51f181efcd23c81cf
    with:
      clients_repository: opto-sync/opto-sync-clients
      clients_ref: abd83db42f604ce1094bdb24230672d7e6010bac
      clients_root: clients
      disabled_languages: 'cpp,zig'
    secrets:
      read_token: ${{ secrets.TEST_ORG_READ_TOKEN }}
