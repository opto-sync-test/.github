name: Polyglot SDK consumer matrix

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * 2,5'
  workflow_dispatch:
  repository_dispatch:
    types: [clients-updated]

permissions:
  contents: read

jobs:
  sdk-clients:
    uses: zed-pkg-test/.github/.github/workflows/sdk-client-language-matrix.yml@9aa85314537b8c6dffdf8c4349abda58bd4494f5
    with:
      clients_repository: opto-sync/opto-sync-clients
      clients_ref: 98f76600ae402d38e5c812a7ec38d48f7b42000b
      clients_root: clients
      disabled_languages: 'cpp,zig'
    secrets:
      read_token: ${{ secrets.TEST_ORG_READ_TOKEN }}
