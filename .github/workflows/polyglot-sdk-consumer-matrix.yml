name: Polyglot SDK consumer matrix

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * 2,5'
  workflow_dispatch:
  repository_dispatch:
    types: [clients-updated]

permissions:
  contents: read

jobs:
  sdk-clients:
    uses: zed-pkg-test/.github/.github/workflows/sdk-client-language-matrix.yml@240b2f0905030b865adbfa83e06a47f9fa681264
    with:
      clients_repository: opto-sync/opto-sync-clients
      clients_ref: 55ffb2e922785b12d68be44ae256ff61a497f8a1
      clients_root: clients
      disabled_languages: 'cpp,zig'
    secrets:
      read_token: ${{ secrets.TEST_ORG_READ_TOKEN }}
