name: Export DEN-607 audit source

on:
  push:
    branches:
      - agent/den-607-zed-consumer-canary
    paths:
      - '.audit-export/ready'
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - '.audit-export/ready'
      - '.github/workflows/export-den-607-audit.yml'

permissions:
  contents: read

jobs:
  export:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact audit branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: agent/den-607-zed-consumer-canary

      - name: Package source without Git metadata
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=.audit-export -czf /tmp/opto-sync-test-den-607-source.tar.gz .
          sha256sum /tmp/opto-sync-test-den-607-source.tar.gz > /tmp/opto-sync-test-den-607-source.tar.gz.sha256

      - name: Upload exact source snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opto-sync-test-den-607-source
          path: |
            /tmp/opto-sync-test-den-607-source.tar.gz
            /tmp/opto-sync-test-den-607-source.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
